<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enigma do Mestre dos Elementos</title>
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon">
    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Enigma do Mestre dos Elementos</h1>
        <div class="description">
            <p>Insira números separados por vírgulas para descobrir a sequência dos elementos:</p>
            <ul>
                <li><span class="fire">Fogo (🔥):</span> múltiplos de 3</li>
                <li><span class="water">Água (💧):</span> múltiplos de 5</li>
                <li><span class="earth">Terra (🌱):</span> múltiplos de 7</li>
                <li><span class="air">Ar (💨):</span> múltiplos de 11</li>
            </ul>
        </div>
        <div class="input-container">
            <input type="text" id="numbers-input" placeholder="Exemplo: 2, 3, 5, 15, 21, 77, 8" class="elemental-input">
        </div>
        <div class="buttons-container">
            <button class="glow-on-hover fire-button" type="button" id="solve-button">DESVENDAR</button>
            <button class="glow-on-hover water-button" type="button" id="reset-button">REINICIAR</button>
        </div>
        <div class="result-container">
            <h2>Resultado:</h2>
            <div id="result" class="result-box"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
